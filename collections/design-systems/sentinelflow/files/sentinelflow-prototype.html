  anchor.setAttribute('aria-expanded','true'); p._anchor = anchor;
  p.querySelector('button')?.focus();
  p.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) { closePop(); onPick(b.dataset.v); } });

  if (a.dataset.dtab) { S.dTab = a.dataset.dtab; render(); $(`[data-dtab="${S.dTab}"]`)?.focus(); return; }
  if (a.dataset.comp) { const v = $('#cmp')?.value; S.composer = a.dataset.comp; render(); const c = $('#cmp'); if (c) { c.value = v || ''; } $(`[data-comp="${S.composer}"]`)?.focus(); return; }
  if (a.dataset.since) { S.portal.since = a.dataset.since; S.portal.where = $('#pw')?.value ?? S.portal.where; render(); $(`[data-since="${a.dataset.since}"]`)?.focus(); return; }
  if (a.dataset.svc) { S.portal.text = a.dataset.svc; S.portal.step = 1; render(); $('#pw')?.focus(); return; }
  if (a.dataset.pop) {
    e.stopPropagation(); const k = a.dataset.pop;
    if (k === 'site') popover(a, `<small>Lycée</small>${S.fSite?'<button data-v="">Tous les lycées</button><div class="sep"></div>':''}${Object.entries(SITES).map(([c,s])=>`<button role="menuitemradio" aria-checked="${S.fSite===c}" data-v="${c}">${s.short}<span class="mono" style="margin-left:auto;color:var(--sf-text-3)">${c}</span></button>`).join('')}`, v => { S.fSite = v || null; S.cur = 0; render(); $('[data-pop="site"]')?.focus(); });
    if (k === 'prio' || k === 'bulk-prio') popover(a, `<small>Priorité</small>${k==='prio'&&S.fPrio?'<button data-v="">Toutes</button><div class="sep"></div>':''}${[1,2,3,4].map(p=>`<button role="menuitemradio" aria-checked="${k==='prio'&&S.fPrio===p}" data-v="${p}">${prio(p)}</button>`).join('')}`, v => {
      if (k === 'prio') { S.fPrio = v ? +v : null; render(); $('[data-pop="prio"]')?.focus(); }
      else { const prev = [...S.sel].map(id => [id, T(id).p]); S.sel.forEach(id => T(id).p = +v); const n = S.sel.size; S.sel.clear(); render(); toast(`Priorité ${PRIO[v].l} appliquée à ${n} ticket${n>1?'s':''}.`, [['Annuler', () => { prev.forEach(([id,p]) => T(id).p = p); render(); }]]); }
    });
    if (k === 'assign') popover(a, `<small>Assigner à</small>${Object.entries(PEOPLE).filter(([c])=>c!=='cm').map(([c,p])=>`<button role="menuitemradio" aria-checked="${T(a.dataset.id).who===c}" data-v="${c}">${av(c)}${p.name}${c===ME?' (moi)':''}</button>`).join('')}`, v => assign(a.dataset.id, v));
    if (k === 'suspend') popover(a, `<small>Suspendre le SLA : en attente de</small>${Object.entries(WAIT).map(([c,l])=>`<button data-v="${c}">${l.charAt(0).toUpperCase()+l.slice(1)}</button>`).join('')}`, v => { const t = T(a.dataset.id), prev = {...t}; t.s = 'wait'; t.wait = v; render(); toast(`SLA de ${t.id} suspendu : attente ${WAIT[v]}.`, [['Annuler', () => { Object.assign(t, prev); delete t.wait; if(prev.wait) t.wait = prev.wait; render(); }]]); });
    return;
  }
  const act = a.dataset.act; const id = a.dataset.id;
  if (['palette','create'].includes(act) || act === 'org') e.preventDefault();
  switch (act) {
    case 'palette': palette(); break;
    case 'create': createDialog(); break;
    case 'org': popover(a, `<small>Périmètre</small><button role="menuitemradio" aria-checked="true" data-v="n">Pôle Nord · 6 lycées</button><button role="menuitemradio" aria-checked="false" data-v="s">Pôle Sud · 6 lycées</button><button role="menuitemradio" aria-checked="false" data-v="a">Toute la région · 12 lycées</button>`, v => toast(v==='n'?'Déjà sur le pôle Nord.':'Prototype : seules les données du pôle Nord sont fournies.')); break;
    case 'close-pv': S.preview = null; render(); $(`tr[data-i="${S.cur}"]`)?.focus(); break;
    case 'take': assign(id, ME); break;
    case 'resolve': resolveDialog(id); break;
    case 'reopen': { const t = T(id); t.s = 'prog'; render(); toast(`${id} rouvert.`); break; }
    case 'resume': { const t = T(id), prev = {...t}; t.s = 'prog'; render(); toast(`Décompte du SLA de ${id} repris.`, [['Annuler', () => { Object.assign(t, prev); render(); }]]); break; }
    case 'attach': { const t = T(id), prev = {...t}; t.s = 'res'; t.who = ME; S.preview = null; render(); toast(`${id} rattaché à ${t.dupOf}. ${t.req} sera prévenue au rétablissement.`, [['Annuler', () => { Object.assign(t, prev); render(); }]]); break; }
    case 'clear': S.q = ''; S.fSite = null; S.fPrio = null; render(); $('#q')?.focus(); break;
    case 'retry': S.data = 'normal'; render(); toast('Liste rechargée.'); break;
    case 'bulk-me': { const prev = [...S.sel].map(i => [i, {...T(i)}]); S.sel.forEach(i => { const t = T(i); t.who = ME; if (t.s === 'new') t.s = 'prog'; }); const n = S.sel.size; S.sel.clear(); render(); toast(`${n} ticket${n>1?'s':''} assigné${n>1?'s':''} à vous.`, [['Annuler', () => { prev.forEach(([i,p]) => Object.assign(T(i), p)); render(); }]]); break; }
    case 'bulk-clear': S.sel.clear(); render(); break;
    case 'arrive': S.arrived = true; render(); toast('Arrivée au lycée Gustave-Eiffel notée à 10:42. Les demandeurs de 2 tickets sont prévenus.', [['Annuler', () => { S.arrived = false; render(); }]]); break;
    case 'charttable': S.chartTable = !S.chartTable; render(); $('[data-act="charttable"]')?.focus(); break;
    case 'concerned': S.concerned = !S.concerned; render(); $('[data-act="concerned"]')?.focus(); break;
    case 'pedit': S.portal.step = 0; render(); $('#ask')?.focus(); break;
    case 'pcancel': S.portal = {...S.portal, step:0, text:''}; render(); $('#ask')?.focus(); break;
    case 'pnew': S.portal = {...S.portal, step:0, text:'', sent:null}; render(); $('#ask')?.focus(); break;
    case 'pfile': S.portal.file = !S.portal.file; S.portal.where = $('#pw')?.value ?? S.portal.where; render(); $('[data-act="pfile"]')?.focus(); break;
    case 'kbopen': toast('Prototype : les articles de la base de connaissances ne sont pas maquettés.'); break;
    case 'focus-composer': S.dTab = 'act'; render(); $('#cmp')?.focus(); break;
    case 'eqtab': e.preventDefault(); S.dTab = 'eq'; render(); $('[data-dtab="eq"]')?.focus(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; S.cur = 0; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === 'ask') { S.portal.text = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#ask'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f || f === 'create' || f === 'resolve') return;
  e.preventDefault();
  if (f === 'composer') {
    const v = $('#cmp').value.trim(); const id = route()[1];
    if (!v) { $('#cmp').focus(); toast('Le message est vide.'); return; }
    (EVENTS[id] = EVENTS[id] || []).push({k: S.composer === 'note' ? 'note' : 'pub', who:'Karim B.', at:'10:42', txt:v, pending: S.data === 'offline'});
    render(); $('#cmp')?.focus();
    toast(S.data === 'offline' ? 'Enregistré sur l’appareil, envoi au retour du réseau.' : S.composer === 'note' ? 'Note interne ajoutée.' : `Réponse envoyée à ${T(id).req}.`);
  }
  if (f === 'pask') { const v = $('#ask').value.trim(); if (!v) { $('#ask').setAttribute('aria-invalid','true'); $('#ask-err').innerHTML = `<p class="err" style="color:var(--sf-danger);margin:6px 0 0;font:var(--sf-caption)">Écrivez quelques mots sur le problème pour continuer.</p>`; $('#ask').focus(); return; } S.portal.text = v; S.portal.step = 1; render(); $('#pw')?.focus(); }
  if (f === 'psend') { S.portal.where = $('#pw').value; const id = 'INC-24831'; S.portal.sent = {id, title: S.portal.text.replace(/^./, c => c.toUpperCase()), s:'new', created:'aujourd’hui 10:42', body: S.portal.text, req:'Hélène Garnier'}; S.portal.step = 2; render(); $('.notice[role="status"] a')?.focus(); }
  if (f === 'preply') { const v = $('#pr').value.trim(); if (!v) { $('#pr').focus(); return; } $('#pr').value = ''; toast('Message envoyé au technicien.'); }
});
let gPending = false, gTimer;
document.addEventListener('keydown', e => {
  trap(e);
  const typing = e.target.matches('input,textarea,select,[contenteditable]');
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#layer') ? closeLayer() : palette(); return; }
  if (e.key === 'Escape') { if ($('#pop')) { closePop(true); return; } if ($('#layer')) { closeLayer(); return; } if (S.preview) { S.preview = null; render(); $(`tr[data-i="${S.cur}"]`)?.focus(); return; } if (typing) e.target.blur(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { const f = e.target.closest('form'); if (f) { e.preventDefault(); f.requestSubmit(); } return; }
  if (typing || $('#layer') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?') { helpDialog(); return; }
  if (!S.keys) return;
  const r = route();
  if (gPending) { gPending = false; const m = {a:'aujourdhui', t:'tickets', r:'tournee', p:'pilotage'}[e.key.toLowerCase()]; if (m) { e.preventDefault(); go(m); } return; }
  if (e.key === 'g') { gPending = true; clearTimeout(gTimer); gTimer = setTimeout(() => gPending = false, 1200); return; }
  if (e.key === 'n') { e.preventDefault(); createDialog(); return; }
  if (e.key === 'r' && r[0] === 'tickets' && r[1] && T(r[1]) && isOpen(T(r[1]))) { e.preventDefault(); resolveDialog(r[1]); return; }
  if (r[0] === 'tickets' && !r[1]) {
    const rows = $$('.grid tbody tr[data-id]');
    if (e.key === '/') { e.preventDefault(); $('#q')?.focus(); return; }
    if (!rows.length) return;
    if (e.key === 'j' || e.key === 'k') { e.preventDefault(); S.cur = Math.max(0, Math.min(rows.length - 1, S.cur + (e.key === 'j' ? 1 : -1))); if (S.preview) S.preview = rows[S.cur].dataset.id; render(); $(`tr[data-i="${S.cur}"]`)?.focus(); return; }
    if (e.key === 'x') { const id = rows[S.cur]?.dataset.id; if (id) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); $(`tr[data-i="${S.cur}"]`)?.focus(); } return; }
    if (e.key === 'Enter') { const tr = e.target.closest('tr[data-id]') || rows[S.cur]; if (tr) { e.preventDefault(); if (S.preview === tr.dataset.id) go('tickets/' + tr.dataset.id); else { S.preview = tr.dataset.id; S.cur = +tr.dataset.i; render(); $(`tr[data-i="${S.cur}"]`)?.focus(); } } }
  }
});
window.addEventListener('hashchange', () => { closeLayer(true); closePop(); const h = location.hash; if (h.includes('?note')) { history.replaceState(null, '', h.replace('?note','')); S.dTab = 'act'; render(); $('#cmp')?.focus(); return; } S.dTab = 'act'; render(); });
window.addEventListener('resize', () => { const m = matchMedia('(max-width:639px)').matches; if (m !== $('#stage').classList.contains('native')) render(); });

/* ---------------- barre du prototype ---------------- */
function syncProto() {
  $('#p-role').value = S.role; $('#p-data').value = S.data; $('#p-density').value = S.density;
  $('#p-theme').setAttribute('aria-pressed', S.theme === 'dark'); $('#p-phone').setAttribute('aria-pressed', S.phone);
}
function afterRender(r) {}
function initProto() {
  $('#p-role').addEventListener('change', e => { S.role = e.target.value; persist(); S.preview = null; go(S.role === 'req' ? 'portail' : S.role === 'lead' ? 'pilotage' : 'aujourdhui'); });
  $('#p-data').addEventListener('change', e => { S.data = e.target.value; render(); });
  $('#p-density').addEventListener('change', e => { S.density = e.target.value; persist(); render(); });
  $('#p-theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; persist(); render(); });
  $('#p-phone').addEventListener('click', () => { S.phone = !S.phone; render(); });
  const p = new URLSearchParams(location.search);
  if (p.get('theme')) S.theme = p.get('theme');
  if (p.get('phone')) S.phone = true;
  if (p.get('data')) S.data = p.get('data');
  if (p.get('density')) S.density = p.get('density');
  if (p.get('preview')) S.preview = p.get('preview');
  if (p.get('view')) S.view = p.get('view');
}
initProto();
render();
window.__sf = {S, render, palette, createDialog, resolveDialog, helpDialog};
})();

</script>
