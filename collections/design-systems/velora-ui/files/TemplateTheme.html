<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velora UI — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  calm, tactile sales CRM — reconstruction from the original reference video
   IDEA   a stack of coloured deal cards on frosted cream glass
   PICTURE the data itself: kanban, charts, deal cards
   COLOUR warm peach→sage wash, ink #191B1B, mustard / pine / vermilion as stage colours
   TYPE   Urbanist 400–700, tabular figures; LAYOUT top tabs, floating rail left, dock bottom */
:root{
  --y:#EFC945;--g:#2F5D50;--r:#C8441F;--k:#191B1B;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.45,.64,1);--sheet:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
  --bg:#ECE6DC;--bgA:#F1DAC0;--bgB:#DFEBDD;
  --ink:#191B1B;--mute:#7A7D78;--faint:#A6A8A2;
  --card:rgba(248,245,239,.7);--cardB:rgba(255,255,255,.65);--solid:#F7F4EE;
  --chip:#FBFAF7;--chipB:rgba(25,27,27,.07);--track:rgba(25,27,27,.065);
  --line:rgba(25,27,27,.08);--shadow:0 20px 40px -26px rgba(80,60,30,.35),0 2px 6px -3px rgba(80,60,30,.08);
  --scrim:rgba(234,229,220,.38);--won:#F6F3ED;--kc:#191B1B;
}
:root[data-theme=dark]{
  color-scheme:dark;--bg:#111312;--bgA:#2B2118;--bgB:#11211A;--ink:#EDECE7;--mute:#999C95;--faint:#6C6F69;
  --card:rgba(33,35,33,.72);--cardB:rgba(255,255,255,.06);--solid:#1C1E1C;--chip:#262826;--chipB:rgba(255,255,255,.08);
  --track:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--shadow:0 20px 40px -24px rgba(0,0,0,.8);
  --scrim:rgba(8,10,9,.5);--won:#2A2C2A;--kc:#0B0C0C;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;--bg:#111312;--bgA:#2B2118;--bgB:#11211A;--ink:#EDECE7;--mute:#999C95;--faint:#6C6F69;
  --card:rgba(33,35,33,.72);--cardB:rgba(255,255,255,.06);--solid:#1C1E1C;--chip:#262826;--chipB:rgba(255,255,255,.08);
  --track:rgba(255,255,255,.07);--line:rgba(255,255,255,.08);--shadow:0 20px 40px -24px rgba(0,0,0,.8);
  --scrim:rgba(8,10,9,.5);--won:#2A2C2A;--kc:#0B0C0C;}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 Urbanist,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(75% 55% at 0% 0%,var(--bgA),transparent 72%),radial-gradient(70% 60% at 100% 100%,var(--bgB),transparent 72%),var(--bg);transition:background .5s}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:10px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.cnt{filter:blur(.5px)}
.mute{color:var(--mute)}

/* shell */
.app{max-width:1200px;margin:0 auto;padding:18px clamp(14px,3vw,28px) 130px clamp(78px,7vw,100px)}
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:21px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--kc);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:500;font-size:17px}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chipB);position:relative;transition:transform .3s var(--spring),background .2s;flex:none}
.ib:hover{transform:scale(1.07)}.ib:active{transform:scale(.93)}
.ib svg{width:17px;height:17px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:15px;height:15px}
.ib.ghost{background:transparent}
.ib.dot::after{content:"";position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--r);box-shadow:0 0 0 2px var(--chip)}
.ib.on{background:var(--kc);color:#fff;border-color:transparent}
.av{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:9.5px;font-weight:700;color:#2b2b2b;flex:none;letter-spacing:.02em}
.me{width:40px;height:40px;font-size:13px;box-shadow:0 0 0 3px var(--chip)}
.stack{display:flex;padding-left:7px}.stack .av{margin-left:-7px;box-shadow:0 0 0 2px var(--bgc,var(--solid))}

.tabs{position:relative;display:flex;gap:2px;margin:18px 0 24px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;position:relative;z-index:1;padding:9px 14px;border-radius:999px;font-weight:500;font-size:14px;white-space:nowrap;transition:color .35s}
.tabs button:not(.on):hover{background:var(--track)}
.tabs button.on{color:#fff}
.tabs .ind{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:999px;background:var(--kc);box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}

.rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:40;background:var(--kc);border-radius:26px;padding:10px 0;display:flex;flex-direction:column;gap:2px;box-shadow:0 20px 40px -20px rgba(0,0,0,.55)}
.rail button{width:44px;height:34px;display:grid;place-items:center;color:#fff;opacity:.78;position:relative;transition:opacity .2s,transform .3s var(--spring)}
.rail button:hover{opacity:1;transform:scale(1.12)}
.rail button svg{width:16px;height:16px}
.rail button span{position:absolute;left:calc(100% + 10px);top:50%;background:var(--kc);color:#fff;font-size:12.5px;font-weight:500;padding:5px 10px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-6px,-50%);transition:opacity .2s,transform .3s var(--ease)}
.rail button:hover span,.rail button:focus-visible span{opacity:1;transform:translate(0,-50%)}
.rail hr{border:0;height:1px;background:rgba(255,255,255,.14);margin:6px 10px}
@media(max-width:560px){.rail{display:none}.app{padding-left:14px}}

.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:45;display:flex;align-items:center;gap:12px;background:var(--kc);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 20px 40px -18px rgba(0,0,0,.6);font-size:13.5px;white-space:nowrap}
.dock .pulse{width:8px;height:8px;border-radius:50%;background:var(--y);box-shadow:0 0 0 0 rgba(239,201,69,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(239,201,69,0)}100%{box-shadow:0 0 0 0 rgba(239,201,69,0)}}
.dock button{background:var(--y);color:var(--k);font-weight:600;padding:8px 16px;border-radius:999px;transition:transform .3s var(--spring)}
.dock button:hover{transform:scale(1.05)}

/* page transitions + entrances */
.view{transition:opacity .24s var(--ease),filter .24s var(--ease),transform .24s var(--ease)}
.view.out{opacity:0;filter:blur(10px);transform:scale(.988)}
.rv.in{animation:rise .8s var(--ease) backwards;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(5px) saturate(.25) brightness(1.12)}}
.chr{display:inline-block;white-space:pre;animation:chIn .7s var(--ease) backwards}
@keyframes chIn{from{opacity:0;filter:blur(7px);transform:translateY(.3em)}}

/* page header */
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:14px 28px;margin-bottom:20px}
.ph h1{margin:0;font-size:clamp(28px,3.3vw,35px);line-height:1.04;font-weight:500;letter-spacing:-.025em;display:flex;align-items:center;gap:14px}
.ph h1 .ib{width:42px;height:42px}
.stats{display:flex;flex-wrap:wrap;gap:12px 26px}
.stat{display:flex;align-items:center;gap:10px}
.stat .ic{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:1px solid var(--chipB)}
.stat .ic svg{width:17px;height:17px}
.stat b{font-size:20px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:7px;line-height:1.2}
.stat small{display:block;color:var(--mute);font-size:12.5px;line-height:1.25;max-width:160px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--g);color:#fff;white-space:nowrap;letter-spacing:0}
.pill.y{background:var(--y);color:#191B1B}.pill.r{background:var(--r)}.pill.soft{background:var(--chip);color:var(--ink);border:1px solid var(--chipB)}

.card{background:var(--card);border:1px solid var(--cardB);border-radius:24px;padding:18px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2)}
.chd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.chd h3{margin:0;font-size:15px;font-weight:600;flex:1;letter-spacing:-.005em}
.chd .note{font-size:12.5px;color:var(--mute)}
.sub{font-size:12.5px;color:var(--mute);margin:-4px 0 12px}
.big{font-size:clamp(26px,3vw,31px);font-weight:600;letter-spacing:-.025em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big small{font-size:12.5px;font-weight:500;color:var(--mute);letter-spacing:0}
.big small b{color:var(--ink)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mute);align-items:center;margin-top:6px}
.lg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.lg i.dash{width:14px;height:0;border-radius:0;border-top:2px dashed var(--ink);vertical-align:3px}
.grid{display:grid;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}

/* segmented control */
.seg{position:relative;display:inline-flex;background:var(--track);border-radius:999px;padding:3px;flex:none}
.seg button{position:relative;z-index:1;padding:6px 12px;font-size:12.5px;font-weight:500;border-radius:999px;color:var(--mute);transition:color .3s;white-space:nowrap}
.seg button.on{color:var(--ink)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--chip);box-shadow:0 1px 4px rgba(0,0,0,.12);transition:left .5s var(--spring),width .5s var(--spring)}
.seg.dark{background:none;padding:0;gap:6px}
.seg.dark button{background:var(--chip);border:1px solid var(--chipB);padding:7px 13px;color:var(--ink);transition:color .3s,background .3s,border-color .3s}
.seg.dark button.on{background:transparent;border-color:transparent;color:#fff}
.seg.dark .knob{top:0;bottom:0;background:var(--kc)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .3s var(--spring),background .2s}
.btn:hover{transform:translateY(-1px) scale(1.02)}.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px}
.btn.dk{background:var(--kc);color:#fff}
.btn.lt{background:var(--chip);border:1px solid var(--chipB)}
.search{display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--chipB);border-radius:999px;padding:0 14px;height:42px;flex:1 1 220px;max-width:340px}
.search input{border:0;background:none;outline:0;flex:1;font-size:16px;height:100%}
.search input::placeholder{color:var(--faint)}
.search svg{width:16px;height:16px;color:var(--mute)}

/* charts */
.fig{position:relative;height:200px;margin-top:6px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ax{font-size:10.5px;fill:var(--mute);font-family:Urbanist,sans-serif}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;line-height:1.35;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .22s var(--ease);white-space:nowrap;z-index:3}
.tip b{display:block;font-size:12.5px}
.tip em{font-style:normal;color:var(--mute)}
.clipin{transform-box:fill-box;transform-origin:left;animation:clipIn 1.3s var(--ease) both}
@keyframes clipIn{from{transform:scaleX(0)}}

/* deal cards */
.dc{--bgc:var(--y);--fg:#191B1B;background:var(--bgc);color:var(--fg);border-radius:18px;padding:13px 14px 12px;display:flex;flex-direction:column;min-height:126px;position:relative;cursor:pointer;transition:background-color .5s var(--ease),color .5s,transform .35s var(--spring),box-shadow .35s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.dc:hover{transform:translateY(-2px);box-shadow:0 16px 26px -18px rgba(0,0,0,.45)}
.dc .t1{font-size:12px;opacity:.72;padding-right:30px}
.dc .more{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid color-mix(in srgb,currentColor 28%,transparent);display:grid;place-items:center;transition:background .2s}
.dc .more:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.dc .more svg{width:14px;height:14px}
.dc h4{margin:9px 0 2px;font-size:16px;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.dc .co{font-size:12.5px;opacity:.72}
.dc .bt{margin-top:auto;padding-top:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.dc .amt{font-size:19px;font-weight:600;letter-spacing:-.015em}
.dc .meta{font-size:11.5px;opacity:.72}
.st-qual{--bgc:var(--y);--fg:#191B1B}.st-prop{--bgc:var(--g);--fg:#fff}.st-nego{--bgc:var(--r);--fg:#fff}.st-close{--bgc:#191B1B;--fg:#fff}.st-won{--bgc:var(--won);--fg:var(--ink)}.st-lost{--bgc:var(--track);--fg:var(--mute)}
:root[data-theme=dark] .st-close,.dk-close{--bgc:#0B0C0C}
.dc.st-won{border:1px solid var(--line)}
.dc.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}25%{box-shadow:0 0 0 4px color-mix(in srgb,var(--bgc) 55%,transparent)}}

/* overview */
.ov{grid-template-columns:repeat(12,minmax(0,1fr));grid-template-areas:"rev rev rev rev rev rev rev rev rev rev rev rev" "hot hot hot hot hot hot hot hot hot hot hot hot" "quo quo quo quo quo mix mix mix mix mix mix mix"}
@media(max-width:600px){.ov{grid-template-columns:minmax(0,1fr);grid-template-areas:"rev" "hot" "quo" "mix"}}
@media(min-width:1040px){.ov{grid-template-areas:"rev rev rev rev rev rev rev rev quo quo quo quo" "rev rev rev rev rev rev rev rev mix mix mix mix" "hot hot hot hot hot hot hot hot hot hot hot hot"}}
.hot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:520px){.hot{grid-template-columns:repeat(2,minmax(0,1fr))}}
.quota{background:var(--g);color:#fff;border-color:transparent;display:flex;flex-direction:column}
.quota .ib{background:transparent;border-color:rgba(255,255,255,.3);color:#fff}
.gauge{position:relative;width:min(170px,100%);aspect-ratio:1;margin:4px auto 0}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.gauge b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.gauge small{font-size:12px;opacity:.75}
.mixbar{display:flex;gap:6px;height:38px;margin-top:14px}
.mixbar div{border-radius:11px;flex-grow:.0001;flex-basis:0;transition:flex-grow 1s var(--ease),transform .3s var(--spring);position:relative;cursor:default}
.mixbar div:hover{transform:translateY(-3px)}
.mixleg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:14px;font-size:12.5px}
.mixleg span{display:flex;align-items:center;gap:7px}.mixleg span i{width:9px;height:9px;border-radius:3px}.mixleg span b{margin-left:auto;font-weight:600}

/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.col{--c:var(--y);flex:0 0 clamp(210px,24%,290px);scroll-snap-align:start;background:var(--card);border:1px solid var(--cardB);border-radius:22px;padding:12px 10px 0;display:flex;flex-direction:column;height:clamp(380px,calc(100vh - 440px),760px);box-shadow:var(--shadow);transition:background .3s,box-shadow .3s}
.col.over{background:color-mix(in srgb,var(--c) 14%,var(--solid));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 55%,transparent) inset,var(--shadow)}
.colh{display:flex;align-items:center;gap:7px;padding:0 2px 0 6px}
.colh i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.colh b{font-weight:600;font-size:14px}
.colh .n{font-size:11px;font-weight:600;color:var(--mute);background:var(--track);padding:1px 7px;border-radius:999px}
.colh .sp{flex:1}
.cols{font-size:12px;color:var(--mute);padding:2px 0 8px 23px}
.colb{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 2px 26px;flex:1;scrollbar-width:none;-webkit-mask-image:linear-gradient(#000 calc(100% - 30px),transparent);mask-image:linear-gradient(#000 calc(100% - 30px),transparent)}
.colb::-webkit-scrollbar{display:none}
.colb .dc{flex:none}
.colb .empty{font-size:12.5px;color:var(--faint);text-align:center;padding:24px 0;border:1.5px dashed var(--line);border-radius:16px}
.slot{flex:none;border-radius:18px;border:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.dragghost{position:fixed!important;left:0;top:0;z-index:90;pointer-events:none;margin:0;box-shadow:0 34px 50px -20px rgba(0,0,0,.5);will-change:transform;transition:background-color .4s,color .4s}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;position:sticky;bottom:76px;z-index:5}
.zone{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:22px;background:var(--card);border:1px solid var(--cardB);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow);transition:transform .45s var(--spring),background .3s,color .3s}
.zone .zi{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:#fff;flex:none;transition:transform .4s var(--spring)}
.zone.lost .zi{background:var(--track);color:var(--ink)}
.zone b{display:block;font-size:14.5px}.zone small{display:block;font-size:12px;color:var(--mute)}
.zone em{margin-left:auto;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap}
body.dragging .zone{transform:scale(1.02)}
body.dragging .zone em{color:var(--ink)}
.zone.over{transform:scale(1.05)!important;background:var(--g);color:#fff}
.zone.lost.over{background:var(--kc)}
.zone.over small,.zone.over em{color:rgba(255,255,255,.75)!important}
.zone.over .zi{transform:scale(1.15) rotate(-8deg);background:#fff;color:var(--g)}
.zone.bump .zi{animation:bump .6s var(--spring)}
@keyframes bump{40%{transform:scale(1.35)}}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.owners{display:flex;gap:6px}
.owners button{border-radius:50%;transition:transform .3s var(--spring),opacity .3s,box-shadow .3s}
.owners button .av{width:32px;height:32px;font-size:11px}
.owners button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.owners.filtering button:not(.on){opacity:.4}
.owners button:hover{transform:translateY(-2px)}

/* tables */
.tw{overflow-x:auto}.tw table{min-width:640px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;color:var(--mute);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.tbl tr.click{cursor:pointer;transition:background .2s}
.tbl tr.click:hover td{background:var(--track)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td b{font-weight:600}
.tbl .who{display:flex;align-items:center;gap:9px}
.tbl .who .av{width:28px;height:28px;font-size:10px}
.tbl .who small,.tbl small{display:block;color:var(--mute);font-size:11.5px}
.sp-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--track);transition:background .4s,color .4s}
.sp-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.s-paid{color:var(--g)}.s-draft{color:var(--mute)}.s-due{color:#B48A12}.s-overdue{color:var(--r)}
:root[data-theme=dark] .s-paid{color:#7FBFA9}
.sortb{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
.sortb svg{width:13px;height:13px;transition:transform .35s var(--spring)}
.sortb.asc svg{transform:rotate(180deg)}
.trow{animation:rise .5s var(--ease) backwards}

/* customers */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
.cc{cursor:pointer;transition:transform .35s var(--spring),box-shadow .35s;padding:16px}
.cc:hover{transform:translateY(-3px)}
.cc .hd{display:flex;align-items:flex-start;justify-content:space-between}
.cc .hd .av{width:44px;height:44px;font-size:14px}
.star{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;transition:background .3s,color .3s}
.star svg{width:15px;height:15px}
.star.on{background:var(--y);color:#191B1B}
.star.on svg{fill:currentColor}
.star.pop{animation:pop .5s var(--spring)}
@keyframes pop{40%{transform:scale(1.35) rotate(-14deg)}}
.cc h4{margin:12px 0 2px;font-size:16px;font-weight:600}
.cc .role{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--track);border-radius:14px;padding:9px 12px;margin:12px 0}
.box small{display:block;font-size:11px;color:var(--mute)}.box b{font-size:14px;font-weight:600}
.hl{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}
.hl .tr{flex:1;height:4px;border-radius:4px;background:var(--track);overflow:hidden}
.hl .tr i{display:block;height:100%;width:0;border-radius:4px;transition:width 1.1s var(--ease)}
.cc .ft{display:flex;align-items:center;gap:4px;margin-top:12px;font-size:12.5px}
.cc .ft span{flex:1}

/* customer detail */
.cd{grid-template-columns:repeat(12,minmax(0,1fr))}
.cd>.pf{grid-column:span 6}.cd>.di{grid-column:span 6}.cd>.full{grid-column:1/-1}
@media(max-width:700px){.cd>.pf,.cd>.di{grid-column:1/-1}}
.pf{display:flex;flex-direction:column;align-items:center;text-align:center}
.pf .bar{align-self:stretch;display:flex;gap:6px;margin-bottom:6px}
.pf .bar .sp{flex:1}
.ring{position:relative;width:118px;height:118px;margin-top:4px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .av{position:absolute;inset:11px;width:auto;height:auto;font-size:30px}
.ring em{position:absolute;right:-2px;bottom:6px;background:var(--kc);color:#fff;font-style:normal;font-size:11.5px;font-weight:600;padding:4px 7px;border-radius:999px;box-shadow:0 0 0 3px var(--solid)}
.pf h2{margin:12px 0 2px;font-size:22px;font-weight:600;letter-spacing:-.015em}
.pf .role{font-size:13px;color:var(--mute);max-width:240px}
.tags{display:flex;gap:6px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--chipB)}
.tag svg{width:13px;height:13px}
.acts{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.dl{display:flex;flex-direction:column}
.dl .it{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dl .it:last-child{border:0}
.dl .it>svg{color:var(--mute);width:16px;height:16px}
.dl small{display:block;font-size:11px;color:var(--mute)}
.dl .v{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.dl input{width:100%;font-size:16px;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:5px 9px;outline:0}
.dl input:focus{border-color:var(--g)}
.srcs{display:flex;gap:6px;margin-top:3px}
.srcs i{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700;color:#fff}
.hist{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:minmax(170px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 6px;scrollbar-width:none}
.hist .dc{scroll-snap-align:start;min-height:112px}
.hist .dc h4{font-size:14.5px}.hist .dc .amt{font-size:18px}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border:0}
.ck{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;transition:background .3s,border-color .3s,transform .3s var(--spring)}
.ck svg{width:14px;height:14px;stroke-width:2.4;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .05s}
.tasks li.done .ck{background:var(--g);border-color:var(--g);color:#fff;transform:scale(1.08)}
.tasks li.done .ck svg{stroke-dashoffset:0}
.tasks li span{flex:1;position:relative;transition:color .3s}
.tasks li span::after{content:"";position:absolute;left:0;top:52%;height:1.5px;width:0;background:currentColor;transition:width .4s var(--ease)}
.tasks li.done span{color:var(--mute)}.tasks li.done span::after{width:100%}
.tasks small{color:var(--mute);font-size:12px;white-space:nowrap}

/* finance + growth */
.aging{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:4px}
.aging .trk{height:92px;background:var(--track);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.aging .trk i{display:block;width:100%;height:0;background:#353837;border-radius:12px;transition:height 1s var(--spring)}
:root[data-theme=dark] .aging .trk i{background:#C9CCC5}
.aging .trk i.red{background:var(--r);border-radius:2px}
.aging label{display:block;text-align:center;font-size:11px;color:var(--mute);margin-top:6px}
.alist{margin-top:10px;font-size:13px}
.alist div{display:flex;align-items:center;gap:8px;padding:5px 0}
.alist i{width:8px;height:8px;border-radius:2px;background:#353837}
.alist em{margin-left:auto;font-style:normal;color:var(--mute);font-size:12px}
.alist b{min-width:70px;text-align:right}
.fin-list{display:flex;flex-direction:column}
.more-row{display:flex;justify-content:center;margin-top:10px}
.gg{grid-template-columns:repeat(12,minmax(0,1fr))}
.gg>.full{grid-column:1/-1}.gg>.half{grid-column:span 6}
@media(max-width:700px){.gg>.half{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.chipb{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:var(--kc);color:#fff;font-size:12px;font-weight:500;transition:opacity .3s,transform .3s var(--spring)}
.chipb i{width:8px;height:8px;border-radius:50%}
.chipb.off{opacity:.35}
.chipb:active{transform:scale(.95)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:8px;height:190px}
.bars .yl{display:flex;flex-direction:column;justify-content:space-between;font-size:10.5px;color:var(--mute);padding-bottom:20px;text-align:right}
.bars .cols{display:flex;gap:6px;align-items:stretch;padding:0}
.bars .bc{flex:1;display:flex;flex-direction:column;gap:5px;cursor:default}
.bars .bt{flex:1;background:var(--track);border-radius:7px;display:flex;flex-direction:column-reverse;overflow:hidden;position:relative}
.bars .bt i{display:block;height:0;transition:height .9s var(--spring);flex:none}
.bars .bt i:last-child{border-radius:6px 6px 0 0}
.bars label{font-size:10.5px;color:var(--mute);text-align:center;height:15px;white-space:nowrap}
.bars .bc:hover .bt{background:color-mix(in srgb,var(--track) 100%,var(--ink) 6%)}
.bars .bc.cur label{color:var(--ink);font-weight:600}
.donut{position:relative;width:min(170px,70%);aspect-ratio:1;margin:8px auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle.sg{transition:stroke-dashoffset 1s var(--ease),stroke-width .3s,opacity .3s;cursor:pointer}
.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut b{font-size:24px;font-weight:600}.donut small{font-size:12px;color:var(--mute)}
.srcl{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px}
.srcl div{display:flex;align-items:center;gap:7px;transition:opacity .3s}
.srcl i{width:9px;height:9px;border-radius:3px}
.srcl b{margin-left:auto}.srcl em{font-style:normal;color:var(--mute);width:30px;text-align:right}
.dim>*{opacity:.35}.dim>.hi{opacity:1}

/* schedule + projects */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:14px}
.days button{padding:10px 6px;border-radius:16px;background:var(--card);border:1px solid var(--cardB);text-align:center;transition:background .3s,color .3s,transform .3s var(--spring)}
.days button b{display:block;font-size:20px;font-weight:600}
.days button small{font-size:12px;color:inherit;opacity:.7}
.days button.on{background:var(--kc);color:#fff}
.days button:hover{transform:translateY(-2px)}
.agenda{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:stretch}
.ev time{font-size:20px;font-weight:600;letter-spacing:-.01em;padding-top:12px;text-align:right}
.ev time small{display:block;font-size:11.5px;font-weight:500;color:var(--mute)}
.ev .dc{min-height:0;cursor:default}
.ev .dc:hover{transform:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.pj .prg{height:8px;border-radius:8px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden;margin:14px 0 6px}
.pj .prg i{display:block;height:100%;width:0;background:currentColor;border-radius:8px;transition:width 1.2s var(--ease)}
.pj .dc{min-height:170px;cursor:default}

/* overlays */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);-webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1);animation:fadeIn .45s var(--ease) both}
.scrim.bye{animation:fadeOut .35s var(--ease) both}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.modal{position:fixed;z-index:70;overflow:hidden;border-radius:30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.55);background:var(--bgc);color:var(--fg);transition:background-color .55s var(--ease),color .55s}
.mc{padding:24px 26px 24px}
.mc>*{animation:rise .55s var(--ease) backwards}
.modal.closing .mc{opacity:0;transition:opacity .12s}
.mh{display:flex;align-items:center;justify-content:space-between;font-size:13px;opacity:.85}
.mx{width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,currentColor 35%,transparent);display:grid;place-items:center;transition:transform .3s var(--spring),background .2s}
.mx:hover{transform:rotate(90deg);background:color-mix(in srgb,currentColor 10%,transparent)}
.mc h2{margin:12px 0 2px;font-size:clamp(23px,4vw,27px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.mc .co{opacity:.75;font-size:14px}
.mamt{font-size:clamp(36px,7vw,44px);font-weight:600;letter-spacing:-.03em;margin:14px 0 8px}
.stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stg div{font-size:12px;opacity:.7;transition:opacity .4s}
.stg div.cur{opacity:1;font-weight:600}
.stg div i{display:block;height:5px;border-radius:5px;background:color-mix(in srgb,currentColor 22%,transparent);margin-bottom:7px;overflow:hidden}
.stg div i b{display:block;height:100%;width:0;background:currentColor;border-radius:5px;transition:width .6s var(--ease)}
.mbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:color-mix(in srgb,currentColor 11%,transparent);border-radius:18px;padding:12px 14px;margin:16px 0 14px}
.mbox small{display:block;font-size:12px;opacity:.7}.mbox b{font-size:16px;font-weight:600}
.mown{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px;font-weight:500}
.mown>span{display:flex;align-items:center;gap:8px}.mown .av{width:30px;height:30px;font-size:11px}
.mnote{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:14px 0 18px;opacity:.9}
.mnote svg{width:17px;height:17px;margin-top:1px}
.mact{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ob{padding:10px 18px;border-radius:999px;border:1px solid color-mix(in srgb,currentColor 45%,transparent);font-weight:500;transition:background .2s,transform .3s var(--spring)}
.ob:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.wb{display:inline-flex;align-items:center;gap:8px;padding:10px 14px 10px 20px;border-radius:999px;background:rgba(255,255,255,.92);color:#191B1B;font-weight:500;transition:transform .3s var(--spring),opacity .3s;box-shadow:0 6px 16px -8px rgba(0,0,0,.35)}
.st-won .wb,.st-qual .wb{background:#191B1B;color:#fff}
.wb:hover{transform:translateX(2px) scale(1.02)}.wb:active{transform:scale(.95)}
.wb svg{width:16px;height:16px}
.wb[disabled]{opacity:.6;cursor:default;transform:none}
.wb .lbl{display:inline-block;transition:opacity .2s,transform .3s var(--ease)}
.wb .lbl.sw{opacity:0;transform:translateY(-6px)}

.sheet{position:fixed;z-index:70;top:10px;right:10px;bottom:10px;width:min(470px,calc(100vw - 20px));background:var(--solid);border-radius:28px;box-shadow:-30px 0 80px -30px rgba(0,0,0,.45);display:flex;flex-direction:column;transform:translateX(calc(100% + 30px));transition:transform .55s var(--sheet)}
.sheet.open{transform:none}
.shh{padding:20px 22px 12px}
.shh .row h2{margin:0;font-size:22px;font-weight:600;flex:1;letter-spacing:-.015em}
.shh .meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px}
.shb{flex:1;overflow-y:auto;padding:4px 22px 22px}
.doc{position:relative;background:var(--chip);border-radius:20px;padding:22px;box-shadow:0 16px 40px -24px rgba(60,40,20,.35);font-size:13px;border:1px solid var(--chipB)}
.doc.shake{animation:shake .45s var(--ease) .18s}
@keyframes shake{30%{transform:translate(1px,2px) rotate(.3deg)}60%{transform:translate(-1px,-1px) rotate(-.2deg)}}
.doc .lab{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--mute)}
.doc .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.doc .g3{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}
.doc .g3 small{display:block;color:var(--mute);font-size:11.5px}
.doc .ln{display:grid;grid-template-columns:1fr 50px 90px;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.doc .ln.h{color:var(--mute);font-size:12px}
.doc .ln span:nth-child(n+2){text-align:right}
.doc .tot{display:grid;grid-template-columns:1fr auto;gap:8px 20px;margin:12px 0 0 auto;width:min(100%,250px);font-size:13px}
.doc .tot .gt{border-top:2px solid var(--ink);padding-top:8px;font-weight:600;font-size:14.5px}
.doc .foot{margin-top:18px;color:var(--mute);font-size:12px}
.stamp{position:absolute;left:24px;bottom:56px;border:3px solid var(--g);color:var(--g);font-weight:700;font-size:21px;letter-spacing:.12em;padding:4px 14px;border-radius:11px;transform:rotate(-10deg);opacity:.9;pointer-events:none;mix-blend-mode:multiply}
:root[data-theme=dark] .stamp{color:#7FBFA9;border-color:#7FBFA9;mix-blend-mode:normal}
.stamp.slam{animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{opacity:0;transform:scale(2.6) rotate(-2deg)}55%{opacity:.95;transform:scale(.92) rotate(-11deg)}100%{opacity:.9;transform:scale(1) rotate(-10deg)}}
.shf{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

.pal{position:fixed;z-index:80;left:50%;top:12vh;width:min(560px,calc(100vw - 24px));transform:translateX(-50%);background:var(--solid);border-radius:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);border:1px solid var(--line);overflow:hidden;animation:palIn .4s var(--spring) both}
.pal.bye{animation:palOut .2s var(--ease) both}
@keyframes palIn{from{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.96)}}
@keyframes palOut{to{opacity:0;transform:translateX(-50%) scale(.97)}}
.pal .pin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.pal .pin input{flex:1;border:0;outline:0;background:none;font-size:17px}
.pal kbd{font:inherit;font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.pal ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow-y:auto}
.pal li.gh{font-size:11.5px;color:var(--mute);padding:8px 12px 4px}
.pal li.op{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:14px}
.pal li.op small{margin-left:auto;color:var(--mute);font-size:12px}
.pal li.op.sel{background:var(--track)}
.pal li.op .av{width:26px;height:26px}
.pal li.op .sq{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--track)}
.pal li.op .sq svg{width:15px;height:15px}
.pal .none{padding:20px;text-align:center;color:var(--mute)}

.dlg{position:fixed;z-index:80;left:50%;top:50%;width:min(420px,calc(100vw - 24px));transform:translate(-50%,-50%);background:var(--solid);border-radius:26px;padding:22px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:dlgIn .45s var(--spring) both}
.dlg.bye{animation:dlgOut .2s var(--ease) both}
@keyframes dlgIn{from{opacity:0;transform:translate(-50%,-46%) scale(.95)}}
@keyframes dlgOut{to{opacity:0;transform:translate(-50%,-50%) scale(.97)}}
.dlg h2{margin:0 0 14px;font-size:21px;font-weight:600}
.dlg label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.dlg input,.dlg select{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);outline:0}
.dlg input:focus,.dlg select:focus{border-color:var(--g)}
.dlg .row{margin-top:18px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:78px;z-index:95;transform:translate(-50%,20px);opacity:0;background:var(--kc);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:0 16px 30px -14px rgba(0,0,0,.5);transition:transform .45s var(--spring),opacity .3s;display:flex;align-items:center;gap:8px;white-space:nowrap;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast svg{width:16px;height:16px;color:var(--y)}
.demo{font-size:11.5px;color:var(--faint);text-align:center;margin-top:28px}

body.phone .app{max-width:440px;padding-left:14px}
body.phone .rail{left:max(14px,calc(50% - 290px))}

@media(max-width:600px){
  .ph h1{font-size:28px}.stat b{font-size:18px}.stats{gap:10px 18px}
  .zones{grid-template-columns:1fr 1fr;gap:8px}.zone em{display:none}
  .doc{padding:16px}.doc .g3{grid-template-columns:repeat(3,auto);gap:12px}
  .mbox{grid-template-columns:1fr 1fr}
  table.tbl{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
/* Collapsible floating rail: compact, pinned open, or temporary expansion. */
:root{--rail-width:44px;--rail-expanded-width:208px;--rail-offset:14px;--rail-gap:16px;--rail-motion:260ms}
.rail{width:var(--rail-width);transition:width var(--rail-motion) var(--ease);max-height:calc(100dvh - 28px)}
.rail button{width:100%;display:flex;align-items:center;justify-content:flex-start;padding:0 14px;flex-shrink:0;text-align:left;border-radius:12px}
.rail button[data-rail-mode][aria-pressed=true]{color:var(--y);opacity:1}
.rail button[data-rail-mode]:focus-visible,.rail button[data-rail-toggle]:focus-visible{outline:2px solid var(--y);outline-offset:-3px}
.rail[data-open=true]{width:var(--rail-expanded-width);overflow:hidden}
.rail[data-open=true] button:hover{transform:none;background:rgba(255,255,255,.09)}
.rail[data-open=true] button span{left:44px;padding:0;background:transparent;opacity:1;transform:translate(0,-50%);transition:opacity 160ms var(--ease);white-space:nowrap}

function curve(p){if(!p.length)return'';let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}return d}
function resample(v,n){if(v.length===n)return v.slice();return Array.from({length:n},(_,i)=>{const x=i*(v.length-1)/(n-1||1),a=Math.floor(x),b=Math.min(v.length-1,a+1);return v[a]+(v[b]-v[a])*(x-a)})}

 const X=(i,n)=>Pd.l+(W-Pd.l-Pd.r)*(n<2?0:i/(n-1)),Y=v=>Pd.t+(H-Pd.t-Pd.b)*(1-clamp(v,0,cur.max*1.05)/cur.max);
 function draw(){W=svg.clientWidth;H=svg.clientHeight;if(!W)return;const n=cur.labels.length;const ink=getComputedStyle(document.body).color;
  let h=`<defs>${cur.series.map((s,i)=>`<linearGradient id="${id}a${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${s.op||.28}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
  h+=cur.ticks.map(t=>`<text class="ax" x="${Pd.l-8}" y="${Y(t)+3.5}" text-anchor="end">${cur.tf(t)}</text>`).join('');
  const step=Math.ceil(n/(W<420?4:W<700?7:12));
  h+=cur.labels.map((l,i)=>(i%step===0||i===n-1)&&!(i!==n-1&&n-1-i<step&&i%step===0&&n-1-i<step/1.5)?`<text class="ax" x="${X(i,n)}" y="${H-6}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${l}</text>`:'').join('');
  if(cur.target!=null)h+=`<line x1="${Pd.l}" x2="${W-Pd.r}" y1="${Y(cur.target)}" y2="${Y(cur.target)}" stroke="${ink}" stroke-width="1.6" stroke-dasharray="6 5" opacity=".85"/>`;
  h+=`<g class="${first&&!RM?'clipin':''}">`;
  cur.series.forEach((s,si)=>{const pts=shown[si].map((v,i)=>[X(i,n),Y(v)]);const d=curve(pts);
   if(s.area)h+=`<path d="${d} L${pts[n-1][0]},${H-Pd.b} L${pts[0][0]},${H-Pd.b} Z" fill="url(#${id}a${si})"/>`;
   h+=`<path d="${d}" fill="none" stroke="${s.dash?ink:s.color}" stroke-width="${s.dash?1.6:2.2}" ${s.dash?'stroke-dasharray="5 5"':''} stroke-linecap="round"/>`});
  h+=`</g><g class="hov" opacity="0" style="transition:opacity .2s"><line class="gl" y1="${Pd.t}" y2="${H-Pd.b}" stroke="${ink}" stroke-opacity=".18"/>${cur.series.map((s,i)=>`<circle class="hd${i}" r="4.5" fill="${s.dash?ink:s.color}" stroke="var(--solid)" stroke-width="2.5"/>`).join('')}</g>`;
  h+=`<rect x="${Pd.l}" y="0" width="${Math.max(0,W-Pd.l-Pd.r)}" height="${H}" fill="transparent"/>`;
  svg.innerHTML=h;first=false;if(hov>=0)hover(hov)}
 function hover(i){const n=cur.labels.length;i=clamp(i,0,n-1);hov=i;const g=svg.querySelector('.hov');if(!g)return;const x=X(i,n);g.setAttribute('opacity',1);g.querySelector('.gl').setAttribute('x1',x);g.querySelector('.gl').setAttribute('x2',x);

  tip.innerHTML=cur.tip(i);tip.style.opacity=1;const tx=clamp(x,70,W-70),ty=Y(Math.max(...shown.map(v=>v[i])));tip.style.transform=`translate(${tx}px,${ty}px) translate(-50%,calc(-100% - 12px))`}
 svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),n=cur.labels.length;hover(Math.round((e.clientX-r.left-Pd.l)/(W-Pd.l-Pd.r)*(n-1)))});

function barsHTML(el,cols,max,ticks,tf,segs,cur){el.innerHTML=`<div class="yl">${ticks.slice().reverse().map(t=>`<span>${tf(t)}</span>`).join('')}</div><div class="cols">${cols.map((c,i)=>`<div class="bc ${i===cols.length-1&&cur?'cur':''}" title="${esc(c.title)}"><div class="bt">${segs.map(s=>`<i style="background:${typeof s.c==='function'?s.c(i):s.c}"></i>`).join('')}</div><label>${c.l}</label></div>`).join('')}</div>`}
function setBars(el,cols,max,segs,stagger){const bcs=$$('.bc',el);const n=bcs.length;requestAnimationFrame(()=>requestAnimationFrame(()=>bcs.forEach((b,i)=>$$('i',b).forEach((x,j)=>{x.style.transitionDelay=stagger?((n-1-i)*45+j*60)+'ms':'0ms';x.style.height=(cols[i].v[j]/max*100)+'%'}))))}
function renderSeg(first){const n=S.growth,ks=['e','m','s'],data=ks.map(k=>SEG[k].slice(-n).map(v=>S.segOn[k]?v:0)),lab=M12.slice(-n),tot=lab.map((_,i)=>data.reduce((a,d)=>a+d[i],0));const pct=S.segMode==='%';
 const cols=lab.map((l,i)=>({l:n>6?l.slice(0,2):l,title:`${l}: ${ks.map((k,j)=>['Enterprise','Mid-market','SMB'][j]+' $'+data[j][i]+'K').join(', ')}`,v:data.map(d=>pct?(tot[i]?d[i]/tot[i]*100:0):d[i])}));
 const el=$('#segBars');if(first||el.dataset.n!=n){barsHTML(el,cols,0,pct?[0,50,100]:[0,100,200],pct?t=>t+'%':t=>t?'$'+t+'K':'$0',[{c:'var(--g)'},{c:'var(--r)'},{c:'var(--y)'}],1);el.dataset.n=n;setBars(el,cols,pct?100:200,0,1)}else{$('.yl',el).innerHTML=(pct?[100,50,0]:[200,100,0]).map(t=>`<span>${pct?t+'%':t?'$'+t+'K':'$0'}</span>`).join('');setBars(el,cols,pct?100:200,0,0)}
 countTo($('#segTot'),sum(tot,x=>x*1000));ks.forEach((k,j)=>{$(`[data-segv="${k}"]`).textContent=kfmt(sum(SEG[k].slice(-n),x=>x)*1000)})}
function renderDonut(){const sc=S.growth===12?1:S.growth===6?.55:.25,L=LEADS.map(([n,v,c])=>[n,Math.max(1,Math.round(v*sc)),c]),tot=sum(L,x=>x[1]),nc=GST[S.growth][0],C=2*Math.PI*46;let acc=0;
 $('#leadSub').textContent=`How the ${nc} customers who joined in the last ${S.growth} months reached us. One customer can come through several channels.`;
 $('#donut').innerHTML=`<div class="dwrap"><div class="donut"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="46" fill="none" stroke="var(--track)" stroke-width="14"/>${L.map(([n,v,c],i)=>{const len=v/tot*C,gap=2.5,s=`<circle class="sg" data-i="${i}" cx="60" cy="60" r="46" fill="none" stroke="${c}" stroke-width="14" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${C}" data-o="${-acc}" style="transition-delay:${200+i*110}ms"/>`;acc+=len;return s}).join('')}</svg><div><b id="dnum">${nc}</b><small id="dlab">new customers</small></div></div>
 <div class="srcl" id="srcl">${L.map(([n,v,c],i)=>`<div data-i="${i}"><i style="background:${c}"></i>${n}<b>${v}</b><em>${Math.round(v/tot*100)}%</em></div>`).join('')}</div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>$$('#donut .sg').forEach(s=>s.style.strokeDashoffset=s.dataset.o)));
 const hi=i=>{$$('#donut .sg').forEach(s=>{s.style.opacity=i==null||+s.dataset.i===i?1:.3;s.style.strokeWidth=+s.dataset.i===i?17:14});$('#srcl').classList.toggle('dim',i!=null);$$('#srcl div').forEach(d=>d.classList.toggle('hi',+d.dataset.i===i));$('#dnum').textContent=i==null?nc:L[i][1];$('#dlab').textContent=i==null?'new customers':L[i][0]};

function renderNC(){const n=S.growth,v=NEWC.slice(-n),l=M12.slice(-n),el=$('#ncBars');const cols=l.map((m,i)=>({l:n>6?m.slice(0,2):m,title:`${m}: ${v[i]} new`,v:[v[i]]}));
 barsHTML(el,cols,4,[0,2,4],t=>t,[{c:i=>i===n-1?'var(--r)':'#353837'}],1);setBars(el,cols,4,0,1);countTo($('#ncTot'),sum(v,x=>x),FMT.int,0)}

function afterGrowth(v){renderSeg(true);renderDonut();renderNC();const ch=lineChart($('.fig',v),wrCfg());redrawCharts=()=>{ch.draw()};
 const wr=()=>{const won=Math.round(S.growth*3.75),cl=Math.round(won/(WINR[11]/100));$('#wrSub').textContent=`${won} won of ${cl} closed, last ${S.growth} months`};wr();
 bindSeg('gSeg',x=>{S.growth=parseInt(x);const g=GST[S.growth],st=$$('.ph .stat [data-c]');countTo(st[0],g[0],FMT.int);countTo(st[1],g[1]);countTo(st[2],g[2],FMT.int);st[0].closest('.stat').querySelector('small').textContent='New customers, last '+S.growth+' months';
  renderSeg(false);renderDonut();renderNC();ch.set(wrCfg());wr();$$('#view .big small').forEach(s=>{s.textContent=s.textContent.replace(/last \d+ months/,'last '+S.growth+' months')})});
 bindSeg('gMode',x=>{S.segMode=x;renderSeg(false)});
 $('#segChips').addEventListener('click',e=>{const b=e.target.closest('.chipb');if(!b)return;const k=b.dataset.k;S.segOn[k]=S.segOn[k]?0:1;if(!S.segOn.e&&!S.segOn.m&&!S.segOn.s){S.segOn[k]=1;return}b.classList.toggle('off',!S.segOn[k]);b.setAttribute('aria-pressed',!!S.segOn[k]);renderSeg(false)});
 $('#gexp').onclick=()=>copyText('Month,Enterprise,Mid-market,SMB,New customers,Win rate\n'+M12.map((m,i)=>[m,SEG.e[i]*1000,SEG.m[i]*1000,SEG.s[i]*1000,NEWC[i],WINR[i]+'%'].join(',')).join('\n'),'Growth CSV copied')}

let OV=[];
function scrim(onclick){const s=document.createElement('div');s.className='scrim';s.onclick=onclick;document.body.appendChild(s);return s}
function killScrim(s){s.classList.add('bye');setTimeout(()=>s.remove(),350)}
function openDeal(id,src){const d=dealBy(id);if(!d)return;const vw=innerWidth,vh=innerHeight,W=Math.min(500,vw-24);
 const m=document.createElement('div');m.className='modal st-'+d.st;m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',d.t);
 const render=()=>{const i=ORDER.indexOf(d.st),nx=ORDER[i+1];return `<div class="mc" style="width:${W}px"><div class="mh"><span>Opened ${d.opened}, 2026</span><button class="mx" data-x aria-label="Close">${I.x}</button></div>
  <h2>${esc(d.t)}</h2><div class="co">${esc(d.co)}</div><div class="mamt num">${money(d.amt)}</div>
  <div class="stg">${ORDER.map((s,k)=>`<div class="${k===i?'cur':''}"><i><b style="width:${k<=i?100:0}%"></b></i>${SL[s]}</div>`).join('')}</div>
  <div class="mbox"><div><small>Expected close</small><b>${d.close}, ${pd(d.close).getFullYear()}</b></div><div><small>Probability</small><b class="num" id="mprob">${PROB[d.st]}%</b></div><div><small>Weighted</small><b class="num" id="mw">${money(d.amt*PROB[d.st]/100)}</b></div></div>
  <div class="mown">${d.own.map(n=>`<span>${av(n)}${n}</span>`).join('')}</div>
  <div class="mnote">${I.note}<span>${esc(d.note)}</span></div>
  <div class="mact"><button class="ob" data-open>Open in pipeline</button><button class="wb" data-move ${nx?'':'disabled'}><span class="lbl">${nx?'Move to '+SL[nx]:'Closed won'}</span>${nx?I.chevR:I.check}</button></div></div>`};
 m.innerHTML=render();m.style.cssText=`left:${(vw-W)/2}px;top:0;width:${W}px;visibility:hidden`;document.body.appendChild(m);
 const H=Math.min(m.firstElementChild.offsetHeight,vh-24),T={l:(vw-W)/2,t:Math.max(12,(vh-H)/2),w:W,h:H};m.style.height=H+'px';m.style.top=T.t+'px';m.style.overflowY='auto';m.style.visibility='';
 const sc=scrim(()=>close());const r=src&&src.getBoundingClientRect&&src.getBoundingClientRect();const srcBg=src?getComputedStyle(src).backgroundColor:null;
 if(r&&r.width&&!RM){src.style.visibility='hidden';m.animate([{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:'18px',backgroundColor:srcBg},{left:T.l+'px',top:T.t+'px',width:T.w+'px',height:T.h+'px',borderRadius:'30px',backgroundColor:getComputedStyle(m).backgroundColor}],{duration:560,easing:'cubic-bezier(.32,.72,0,1)'});$$('.mc>*',m).forEach((e,k)=>e.style.animationDelay=(140+k*35)+'ms')}
 else m.animate([{opacity:0,transform:'scale(.95)'},{opacity:1,transform:'none'}],{duration:350,easing:'cubic-bezier(.34,1.45,.64,1)'});
 setTimeout(()=>{const b=m.querySelector('[data-move]');b&&b.focus({preventScroll:true})},500);
 function close(after){if(m._c)return;m._c=1;OV=OV.filter(o=>o.close!==close);killScrim(sc);m.classList.add('closing');const live=src&&src.isConnected?src:document.querySelector(`.dc[data-id="${d.id}"]`);const rr=live&&live.getBoundingClientRect();const cur=m.getBoundingClientRect();
  if(rr&&rr.width&&rr.bottom>0&&rr.top<innerHeight&&!RM){const tb=getComputedStyle(live).backgroundColor;m.animate([{left:cur.left+'px',top:cur.top+'px',width:cur.width+'px',height:cur.height+'px',borderRadius:'30px'},{left:rr.left+'px',top:rr.top+'px',width:rr.width+'px',height:rr.height+'px',borderRadius:'18px',backgroundColor:tb}],{duration:440,easing:'cubic-bezier(.32,.72,0,1)',fill:'forwards'}).onfinish=()=>{live.style.visibility='';m.remove();after&&after()}}
  else{if(live)live.style.visibility='';m.animate([{opacity:1},{opacity:0,transform:'scale(.96)'}],{duration:220,fill:'forwards'}).onfinish=()=>{m.remove();after&&after()}}
  if(src&&src!==live)src.style.visibility=''}
 OV.push({close});
 m.addEventListener('click',e=>{if(e.target.closest('[data-x]'))close();
  if(e.target.closest('[data-open]'))close(()=>{S.pipeView='Board';S.pipeQ='';S.owner=null;nav('pipeline');setTimeout(()=>{const c=$(`.colb .dc[data-id="${d.id}"]`);if(c){c.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1500)}},700)});
  const mv=e.target.closest('[data-move]');if(mv&&!mv.disabled){const i=ORDER.indexOf(d.st),nx=ORDER[i+1];if(!nx)return;const prev=d.st;d.st=nx;if(nx==='won')d.close='Oct 16';
   m.classList.remove('st-'+prev);m.classList.add('st-'+nx);const segs=$$('.stg div',m);segs.forEach((s,k)=>{s.classList.toggle('cur',k===i+1);s.querySelector('b').style.width=k<=i+1?'100%':'0%'});

   const lbl=mv.querySelector('.lbl'),n2=ORDER[i+2];lbl.classList.add('sw');setTimeout(()=>{lbl.textContent=n2?'Move to '+SL[n2]:'Closed won';if(!n2){mv.disabled=true;mv.lastElementChild.outerHTML=I.check}lbl.classList.remove('sw')},200);
   $$(`.dc[data-id="${d.id}"]`).forEach(c=>{c.classList.remove('st-'+prev);c.classList.add('st-'+nx)});
   if(S.route==='pipeline'&&S.pipeView==='Board'){const c=$(`.colb .dc[data-id="${d.id}"]`);if(c){const t=nx==='won'?null:$(`.col[data-st="${nx}"] .colb`);if(t)t.prepend(c);else c.remove()}refreshPipeStats()}
   updDock();toast(nx==='won'?`“${d.t}” won`:`Moved to ${SL[nx]}`)}})}

/* ---------- invoice sheet ---------- */
function openInvoice(no){const inv=INV.find(i=>i.no===no),c=cusBy(inv.cid);const sh=document.createElement('aside');sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-modal','true');sh.setAttribute('aria-label','Invoice '+no);
 const paid=()=>inv.st==='paid';
 sh.innerHTML=`<div class="shh"><div class="row"><h2>Invoice ${no}</h2><button class="ib" data-x aria-label="Close">${I.x}</button></div><div class="meta"><span class="sp-pill s-${inv.st}" id="shst">${SLab[inv.st]}</span><b>${esc(c.co)}</b><span class="mute num">${money(inv.amt)}</span></div></div>
 <div class="shb"><div class="doc" id="doc"><div class="row" style="justify-content:space-between;align-items:flex-start"><span class="logo" style="font-size:19px"><i>V</i>Velora UI</span><div style="text-align:right"><div class="lab">INVOICE</div><b style="font-size:17px">${no}</b></div></div>
  <div class="g2"><div><div class="lab">FROM</div><b>Velora UI (demo)</b><br>21 Harbour Street<br>Rotterdam 3011 AB, NL<br>billing@velora-ui.example</div><div><div class="lab">BILL TO</div><b>${esc(c.co)}</b><br>${esc(c.n)}<br>${esc(c.city)}<br>${esc(c.email)}</div></div>
  <div class="g3"><div><small>Issued</small><b>${inv.iss}, ${pd(inv.iss).getFullYear()}</b></div><div><small>Due</small><b>${inv.due}, ${pd(inv.due).getFullYear()}</b></div><div><small>Terms</small><b>Net 30</b></div></div>
  <div class="ln h"><span>Description</span><span>Qty</span><span>Amount</span></div><div class="ln"><span><b>${esc(inv.desc)}</b><br><small class="mute">Deal ${inv.deal} · ${inv.iss}, 2026</small></span><span>1</span><span class="num">${money(inv.amt)}</span></div>
  <div class="tot"><span class="mute">Subtotal</span><span class="num">${money(inv.amt)}</span><span class="mute">Tax (reverse charge)</span><span>$0</span><span class="gt" id="totl">${paid()?'Total paid':'Total due'}</span><span class="gt num">${money(inv.amt)}</span></div>
  <div class="foot" id="foot">${paid()?`Paid in full on ${inv.paid}, 2026, thank you.`:`Please pay by ${inv.due}, 2026 to NL42 RAPP 0123 4567 89, quoting ${no}.`}</div>${paid()?'<div class="stamp">PAID</div>':''}</div>
  <div class="shf">${paid()?'':`<button class="btn dk" data-pay>${I.check}Mark paid</button>`}<button class="btn lt" data-dl>${I.down}Download</button><button class="btn lt" data-link>${I.link}Copy link</button></div></div>`;
 document.body.appendChild(sh);const sc=scrim(()=>close());requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add('open')));setTimeout(()=>sh.querySelector('[data-x]').focus({preventScroll:true}),400);
 function close(){if(sh._c)return;sh._c=1;OV=OV.filter(o=>o.close!==close);killScrim(sc);sh.classList.remove('open');setTimeout(()=>sh.remove(),560)}
 OV.push({close});
 sh.addEventListener('click',e=>{if(e.target.closest('[data-x]'))close();if(e.target.closest('[data-link]'))copyText('https://velora-ui.example/i/'+no,'Invoice link copied');if(e.target.closest('[data-dl]'))toast('Downloads are off in this preview');
  const pb=e.target.closest('[data-pay]');if(pb){inv.st='paid';inv.paid='Oct 16';pb.animate([{opacity:1},{opacity:0,transform:'scale(.9)'}],{duration:200,fill:'forwards'}).onfinish=()=>pb.remove();
   const st=$('#shst',sh);st.className='sp-pill s-paid';st.textContent='Paid';$('#totl',sh).textContent='Total paid';const f=$('#foot',sh);f.animate([{opacity:0},{opacity:1}],{duration:400});f.textContent=`Paid in full on Oct 16, 2026, thank you.`;
   const doc=$('#doc',sh),s=document.createElement('div');s.className='stamp slam';s.textContent='PAID';doc.appendChild(s);doc.classList.add('shake');navigator.vibrate&&navigator.vibrate([10,30,10]);refreshFinance();toast(`${no} marked as paid`)}})}

/* ---------- create dialogs ---------- */
function openCreate(kind,ctx){const sc=scrim(()=>close());const dl=document.createElement('form');dl.className='dlg';dl.setAttribute('role','dialog');dl.setAttribute('aria-modal','true');
 const F={deal:['New deal',[['t','Deal name','Platform licence'],['co','Company','Tidewater Freight'],['amt','Amount (USD)','25000','number'],['st','Stage','qual','stage']]],customer:['New customer',[['n','Full name','Jordan Lee'],['role','Role','Head of Operations'],['co','Company','Northgate Cinemas'],['seg','Segment','SMB','seg']]],task:['New task',[['t','Task','Send revised proposal'],['d','Due','Oct 20']]],invoice:['New invoice',[['cid','Customer','clara-vos','cus'],['desc','Description','Consulting services'],['amt','Amount (USD)','4800','number']]]}[kind];
 dl.innerHTML=`<h2>${F[0]}</h2>${F[1].map(([k,l,ph,t])=>`<label for="f_${k}">${l}</label>${t==='stage'?`<select id="f_${k}" name="${k}">${STAGES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select>`:t==='seg'?`<select id="f_${k}" name="${k}"><option>Enterprise</option><option>Mid-market</option><option selected>SMB</option></select>`:t==='cus'?`<select id="f_${k}" name="${k}">${CUS.map(c=>`<option value="${c.id}">${esc(c.co)} · ${esc(c.n)}</option>`).join('')}</select>`:`<input id="f_${k}" name="${k}" placeholder="${esc(ph)}" ${t==='number'?'type="number" min="0" inputmode="numeric"':''} required>`}`).join('')}<div class="row"><button type="button" class="btn lt" data-x>Cancel</button><button class="btn dk">${I.plus}Create</button></div>`;
 document.body.appendChild(dl);setTimeout(()=>dl.querySelector('input,select').focus(),60);
 function close(){if(dl._c)return;dl._c=1;OV=OV.filter(o=>o.close!==close);killScrim(sc);dl.classList.add('bye');setTimeout(()=>dl.remove(),220)}
 OV.push({close});dl.querySelector('[data-x]').onclick=close;
 dl.addEventListener('submit',e=>{e.preventDefault();const v=Object.fromEntries(new FormData(dl));close();
  if(kind==='deal'){const d={id:'d'+(++did),t:v.t,co:v.co,amt:+v.amt||0,st:v.st,close:'Nov 30',opened:'Oct 16',own:[TEAM[did%5],TEAM[(did+1)%5]],note:'Created from quick add.'};DEALS.unshift(d);toast('Deal created');
   if(S.route==='pipeline'&&S.pipeView==='Board'){const b=$(`.col[data-st="${d.st}"] .colb`);const t=document.createElement('div');t.innerHTML=dealCard(d);const el=t.firstElementChild;flip([...b.querySelectorAll('.dc')],()=>b.prepend(el));el.classList.add('in');refreshPipeStats()}else if(S.route==='pipeline')renderPBody(true);else nav('pipeline')}
  if(kind==='customer'){const id=v.n.toLowerCase().replace(/[^a-z]+/g,'-')+'-'+(++did);CUS.unshift({id,n:v.n,first:v.n.split(' ')[0],lastN:v.n.split(' ').slice(1).join(' '),role:v.role,co:v.co,seg:v.seg,city:'—',last:'just now',lastH:0,health:70,star:false,email:v.n.split(' ')[0].toLowerCase()+'@example.com',phone:'+00 000 000 000',lastDate:'10/16/2026'});toast('Customer added');if(S.route==='customers')renderCBody(false);else nav('customers')}
  if(kind==='task'&&ctx){taskFor(ctx).unshift({t:v.t,d:v.d,done:false});toast('Task added');go(S.route,true)}
  if(kind==='invoice'){const n='VL-'+(2447+INV.length-17);INV.unshift({no:n,cid:v.cid,iss:'Oct 16',due:'Nov 15',amt:+v.amt||0,st:'draft',paid:0,desc:v.desc,deal:'D'+(40+INV.length)});toast(n+' saved as draft');refreshFinance()}})}

/* ---------- command palette ---------- */
function openPalette(){if($('.pal'))return;const sc=scrim(()=>close());const p=document.createElement('div');p.className='pal';p.setAttribute('role','dialog');p.setAttribute('aria-modal','true');p.setAttribute('aria-label','Search');
 p.innerHTML=`<div class="pin">${I.search}<input placeholder="Jump to a page, customer or deal…" aria-label="Search everything"><kbd>esc</kbd></div><ul role="listbox"></ul>`;document.body.appendChild(p);const inp=$('input',p),ul=$('ul',p);let items=[],sel=0;
 const PAGES=[['overview','Overview','pie'],['pipeline','Pipeline','trend'],['customers','Customers','users'],['schedule','Schedule','cal'],['finance','Finance','receipt'],['growth','Growth','bars'],['projects','Projects','folder']];
 const draw=()=>{const q=inp.value.trim().toLowerCase();const m=s=>!q||s.toLowerCase().includes(q);
  const pg=PAGES.filter(x=>m(x[1])).map(x=>({g:'Pages',h:`<span class="sq">${I[x[2]]}</span>${x[1]}`,go:()=>nav(x[0])}));
  const cu=CUS.filter(c=>q?m(c.n+' '+c.co):c.star).slice(0,6).map(c=>({g:q?'Customers':'Starred',h:`${av(c.n)}${esc(c.n)}<small>${esc(c.co)}</small>`,go:()=>nav('customer-'+c.id)}));
  const de=q?openD().filter(d=>m(d.t+' '+d.co)).slice(0,6).map(d=>({g:'Deals',h:`<span class="sq" style="background:${STAGES.find(s=>s[0]===d.st)[2]}"></span>${esc(d.t)}<small>${esc(d.co)} · ${kfmt(d.amt)}</small>`,go:()=>{const o=S.route==='pipeline';openDeal(d.id,o?$(`.dc[data-id="${d.id}"]`):null)}})):[];
  const iv=q?INV.filter(i=>m(i.no+' '+cusBy(i.cid).co)).slice(0,4).map(i=>({g:'Invoices',h:`<span class="sq">${I.receipt}</span>${i.no}<small>${esc(cusBy(i.cid).co)} · ${SLab[i.st]}</small>`,go:()=>openInvoice(i.no)})):[];
  items=[...pg,...cu,...de,...iv];sel=0;let g='';ul.innerHTML=items.length?items.map((it,i)=>{const head=it.g!==g?`<li class="gh">${it.g}</li>`:'';g=it.g;return head+`<li class="op ${i===0?'sel':''}" role="option" data-i="${i}">${it.h}</li>`}).join(''):'<li class="none">Nothing found</li>'};
 const pick=i=>{const it=items[i];if(!it)return;close();setTimeout(it.go,120)};
 const mark=()=>{$$('.op',ul).forEach(o=>o.classList.toggle('sel',+o.dataset.i===sel));const s=$('.op.sel',ul);s&&s.scrollIntoView({block:'nearest'})};
 inp.addEventListener('input',draw);inp.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){sel=Math.min(items.length-1,sel+1);mark();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(0,sel-1);mark();e.preventDefault()}if(e.key==='Enter')pick(sel)});
 ul.addEventListener('click',e=>{const o=e.target.closest('.op');if(o)pick(+o.dataset.i)});ul.addEventListener('pointermove',e=>{const o=e.target.closest('.op');if(o&&+o.dataset.i!==sel){sel=+o.dataset.i;mark()}});
 function close(){if(p._c)return;p._c=1;OV=OV.filter(o=>o.close!==close);killScrim(sc);p.classList.add('bye');setTimeout(()=>p.remove(),200)}
 OV.push({close});draw();setTimeout(()=>inp.focus(),30)}
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if(e.key==='Escape'&&OV.length)OV[OV.length-1].close();
 if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.matches('.dc[data-id],.cc')){e.preventDefault();document.activeElement.click()}});

/* ---------- csv / digest ---------- */
function dealsCSV(){return 'Deal,Company,Stage,Amount,Close\n'+openD().map(d=>[d.t,d.co,SL[d.st],d.amt,d.close].map(x=>`"${x}"`).join(',')).join('\n')}
function digest(){const op=openD();return `Velora UI weekly digest\nOpen pipeline: ${money(sum(op))} across ${op.length} deals\nWon this month: ${money(sum(wonMonth()))}\nOverdue invoices: ${money(finStats().od)}`}

/* ---------- router ---------- */
const PAGES={overview:[pgOverview,afterOverview],pipeline:[pgPipeline,afterPipeline],customers:[pgCustomers,afterCustomers],schedule:[pgSchedule,afterSchedule],finance:[pgFinance,afterFinance],growth:[pgGrowth,afterGrowth],projects:[pgProjects,afterProjects]};
function enter(root){let i=0;$$('.rv',root).forEach(el=>{el.style.setProperty('--d',Math.min(i++*45,900)+'ms');el.classList.remove('in');void el.offsetWidth;el.classList.add('in')});
 $$('.chr',root).forEach((c,k)=>c.style.animationDelay=(k*22)+'ms');
 $$('[data-c]',root).forEach(el=>{const to=+el.dataset.c,f=FMT[el.dataset.f]||money;el._v=null;countTo(el,to,f,el.dataset.f==='int'||el.dataset.f==='pct'?0:to*.38)});
 $$('.cc [data-w]',root).forEach(w=>requestAnimationFrame(()=>requestAnimationFrame(()=>w.style.width=w.dataset.w+'%')))}
function render(route){ROs.forEach(r=>r.disconnect());ROs=[];redrawCharts=()=>{};const v=$('#view');let key=route,arg;if(route.startsWith('customer-')){key='customer';arg=route.slice(9)}
 if(key==='customer'){v.innerHTML=pgCustomer(arg);enter(v);afterCustomer(v,arg)}else{const p=PAGES[key]||PAGES.overview;v.innerHTML=p[0]();enter(v);p[1](v)}updDock()}
let busy=false,pending=null;
async function go(route,force){if(!force&&route===S.route)return;if(busy){pending=route;return}busy=true;const first=!S.route;S.route=route;moveInd(!first);
 OV.slice().forEach(o=>o.close());const v=$('#view');
 if(!first&&!RM){v.classList.add('out');await wait(240)}
 scrollTo({top:0});render(route);v.classList.remove('out');busy=false;if(pending){const p=pending;pending=null;if(p!==S.route)go(p)}}
function nav(route,force){if(location.hash.slice(1)===route){go(route,force)}else location.hash=route}
const valid=h=>PAGES[h]||(h.startsWith('customer-')&&cusBy(h.slice(9)));
addEventListener('hashchange',()=>{const h=location.hash.slice(1);go(valid(h)?h:'overview')});
$('#view').addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){nav(g.dataset.go);return}if(e.target.closest('[data-back]')){nav('customers');return}
 if(e.target.closest('[data-new]')&&!e.target.closest('.dc')){const b=e.target.closest('[data-new]');openCreate('deal');const st=b.dataset.new;if(st&&st!==''){setTimeout(()=>{const s=$('#f_st');if(s)s.value=st},80)}return}
 if(e.target.closest('[data-newc]')){openCreate('customer');return}
 const dc=e.target.closest('.dc[data-id]');if(dc&&!suppress){const row=null;openDeal(dc.dataset.id,dc);return}
 const tr=e.target.closest('tr[data-id]');if(tr)openDeal(tr.dataset.id,null)});
document.fonts&&document.fonts.ready.then(()=>moveInd(false));
const h0=location.hash.slice(1);go(valid(h0)?h0:'overview');
}
</script>
